name: Tests

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      # One leg failing must not cancel the others. The legs the lock cannot
      # support fail within seconds, so they were taking the one that matters
      # down with them: 8.4 has been reporting "cancelled" rather than a result.
      fail-fast: false
      matrix:
        # 8.4 is the floor: the Symfony 8.1 components in composer.lock require
        # >= 8.4.1, which is why composer.json says ^8.4 and why 8.2 and 8.3
        # could never get past composer install here. The designer also runs
        # 8.5; add it once someone has confirmed the lock installs there.
        php: [8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install frontend packages
        run: npm ci --no-fund --no-audit

      # Inertia renders every page through the Vite manifest, and public/build
      # is not tracked, so without this the whole feature suite fails on
      # "Vite manifest not found" rather than on anything it is testing.
      - name: Build assets
        run: npm run build

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: vendor/bin/phpunit
